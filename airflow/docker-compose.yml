services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    image: apache/airflow:2.10.5-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    command: >
      bash -c "airflow db init &&
               airflow users create
               --username airflow
               --password airflow
               --firstname Admin
               --lastname User
               --role Admin
               --email admin@example.com || true"

  airflow-webserver:
    image: apache/airflow:2.10.5-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      PYTHONPATH: /opt/airflow/project/bronze:/opt/airflow/project/silver:/opt/airflow/project/gold:/opt/airflow/project
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas sqlalchemy psycopg2-binary python-dotenv validators"
      DATABASE_URL: postgresql://postgres:123456@host.docker.internal/postgres
      bronze_csv: bronza.csv
    volumes:
      - ./dags:/opt/airflow/dags
      - ../:/opt/airflow/project
      - ./logs:/opt/airflow/logs
    command: airflow webserver

  airflow-scheduler:
    image: apache/airflow:2.10.5-python3.11
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      PYTHONPATH: /opt/airflow/project/bronze:/opt/airflow/project/silver:/opt/airflow/project/gold:/opt/airflow/project
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas sqlalchemy psycopg2-binary python-dotenv validators"
      DATABASE_URL: postgresql://postgres:123456@host.docker.internal/postgres
      bronze_csv: bronza.csv
    volumes:
      - ./dags:/opt/airflow/dags
      - ../:/opt/airflow/project
      - ./logs:/opt/airflow/logs
    command: airflow scheduler

volumes:
  postgres-db-volume: